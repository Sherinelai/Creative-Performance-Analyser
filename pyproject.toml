requires-python = ">=3.14"
dependencies = [
    "mcp>=1.27.1",
    "looker-sdk>=26.6.1",
    "gspread>=6.2.1",
    "gspread-dataframe>=4.0.0",
    "google-auth>=2.49.2",
    "google-auth-oauthlib>=1.3.1",
    "google-cloud-bigquery>=3.42.2",
    "db-dtypes>=1.7.1",
    "pandas>=3.0.1",
    "numpy>=2.4.0",
    "pyarrow>=25.0.0",
]
