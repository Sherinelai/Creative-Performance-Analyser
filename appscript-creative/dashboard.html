<script>
try{if(typeof Chart!=='undefined'&&typeof ChartDataLabels!=='undefined'){Chart.register(ChartDataLabels);Chart.defaults.set('plugins.datalabels',{display:false});}}catch(e){console.warn('Chart init:',e)}
var D=null,state={app:'all',country:'all',campType:'all',tab:'overview',selRegion:null},allC=[],campCI={},tblCharts={};
var currentDateConfig=null; // null = last 30 days from latest date (default in BigQuery)

// ── Date Range Selection ──
window.setDateRange=function(preset){
  document.querySelectorAll('#date-bar .tab').forEach(function(b){b.classList.remove('on')});
  var btn=document.getElementById('dt-'+preset);if(btn)btn.classList.add('on');
  var customEl=document.getElementById('custom-dates');
  if(preset==='custom'){customEl.style.display='inline-flex';return}
  customEl.style.display='none';
  if(preset==='all'){currentDateConfig={preset:'all'}}
  else{currentDateConfig={preset:preset}}
  reloadData();
};
window.applyCustomDate=function(){
  var s=document.getElementById('date-start').value;
  var e=document.getElementById('date-end').value;
  if(!s||!e){alert('Please select both start and end dates');return}
  if(s>e){alert('Start date must be before end date');return}
  currentDateConfig={startDate:s,endDate:e};
  reloadData();
};
function reloadData(){
  document.getElementById('content').innerHTML='<div style="text-align:center;padding:60px;color:var(--t3)"><div style="font-size:24px;margin-bottom:12px">&#9203;</div>Reloading data...</div>';
  document.getElementById('kpi').innerHTML='';
  google.script.run.withSuccessHandler(function(data){
    if(data.error){document.getElementById('content').innerHTML='<div class="insight" style="color:var(--danger)">'+data.error+'</div>';return}
    D=data;
    // Reset filters but keep app/country/campType
    state.selRegion=null;
    // Rebuild app bar
    var bar=document.getElementById('app-bar');
    while(bar.children.length>1)bar.removeChild(bar.lastChild);
    var apps=[{id:'all',label:'All Apps'}],seen={};
    D.summary.forEach(function(r){var n=r.customer_app_name||r.app_id||'Unknown';if(!seen[n]){seen[n]=1;apps.push({id:n,label:n})}});
    if(!apps.some(function(a){return a.id===state.app}))state.app='all';
    apps.forEach(function(a){var b=document.createElement('button');b.className='tab'+(a.id===state.app?' on':'');b.textContent=a.label;b.onclick=function(){state.app=a.id;state.country='all';state.campType='all';state.selRegion=null;bar.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});b.classList.add('on');renderCountryBar();renderCampTypeBar();dc();renderAll()};bar.appendChild(b)});
    renderCountryBar();renderCampTypeBar();
    document.getElementById('date-range-label').textContent=D.date_range;
    renderTabs();renderAll();
  }).withFailureHandler(function(err){
    document.getElementById('content').innerHTML='<div class="insight" style="color:var(--danger)">Error: '+err.message+'</div>';
  }).getAnalysisData(currentDateConfig);
}

google.script.run.withSuccessHandler(function(data){
  if(!data||typeof data!=='object'){document.getElementById('kpi').innerHTML='<div class="card" style="grid-column:1/-1;text-align:center;padding:40px"><div class="big" style="color:var(--danger)">Bad Response</div><div class="sm">'+String(data).substring(0,200)+'</div></div>';return}
  if(data.error){document.getElementById('kpi').innerHTML='<div class="card" style="grid-column:1/-1;text-align:center;padding:40px"><div class="big" style="color:var(--danger)">Error</div><div class="sm">'+data.error+'</div></div>';return}
  if(!data.summary||!data.summary.length){document.getElementById('kpi').innerHTML='<div class="card" style="grid-column:1/-1;text-align:center;padding:40px"><div class="big" style="color:var(--danger)">No Data</div><div class="sm">summary: '+(data.summary?data.summary.length:typeof data.summary)+' regions: '+(data.regions?data.regions.length:typeof data.regions)+' keys: '+Object.keys(data).join(',')+'</div></div>';return}
  D=data;
  document.getElementById('date-range-label').textContent=D.date_range;
  init();
}).withFailureHandler(function(err){
  document.getElementById('kpi').innerHTML='<div class="card" style="grid-column:1/-1;text-align:center;padding:40px"><div class="big" style="color:var(--danger)">Script Error</div><div class="sm">'+err.message+'</div></div>';
}).getAnalysisData(currentDateConfig);

function fmt(n){if(n==null)return'\u2014';return n>=1e6?'$'+(n/1e6).toFixed(1)+'M':n>=1e3?'$'+(n/1e3).toFixed(1)+'K':'$'+n.toFixed(0)}
function N(n){if(n==null)return'\u2014';return n>=1e3?(n/1e3).toFixed(1)+'K':String(Math.round(n))}
function statusTag(s,cpi,kpi){if(s==='NO_KPI'||!kpi)return'<span class="tag tag-n">NO KPI</span>';if(s==='NO_DNU')return'<span class="tag" style="background:#f0f0f0;color:#888">NO DNU</span>';if(s==='GOOD')return'<span class="tag tag-g">GOOD</span>';var p=((cpi/kpi-1)*100).toFixed(0);return s==='WATCH'?'<span class="tag tag-y">WATCH +'+p+'%</span>':'<span class="tag tag-r">POOR +'+p+'%</span>'}
function plainStatus(s){if(s==='NO_KPI')return'<span class="tag tag-n">N/A</span>';if(s==='NO_DNU')return'<span class="tag" style="background:#f0f0f0;color:#888">N/A</span>';return s==='GOOD'?'<span class="tag tag-g">PASS</span>':s==='WATCH'?'<span class="tag tag-y">FAIL</span>':'<span class="tag tag-r">FAIL</span>'}
function cidLink(cid,crid){if(!cid||cid==='\u2014')return'<span class="mono">\u2014</span>';var id=crid||cid;return'<a class="lift-link" href="https://app.liftoff.io/admin/labrat/creatives?states=enabled&creative_id='+id+'" target="_blank">'+cid+'</a>'}
function campCell(name,cid){var l='';if(cid)l=' <a class="camp-link" href="https://app.liftoff.io/admin/adops/campaigns/'+cid+'/ad_groups" target="_blank">#'+cid+'</a>';return'<div class="camp-cell">'+name+l+'</div>'}
function ltallCell(v,k){if(v==null)return'<span style="color:var(--t3)">\u2014</span>';if(!k)return v.toFixed(0);return'<span class="'+(v>=k?'metric-pass':'metric-fail')+'">'+v.toFixed(0)+'</span>'}
function roi2Cell(v,k){if(v==null)return'<span style="color:var(--t3)">\u2014</span>';if(!k)return v.toFixed(2);return'<span class="'+(v>=k?'metric-pass':'metric-fail')+'">'+v.toFixed(2)+'</span>'}

function dc(){allC.forEach(function(c){try{c.destroy()}catch(e){}});allC=[];for(var k in campCI){try{campCI[k].destroy()}catch(e){}}campCI={};for(var k in tblCharts){try{tblCharts[k].destroy()}catch(e){}}tblCharts={}}
function safeChart(cv,cfg){if(typeof Chart==='undefined'||!cv)return null;try{return new Chart(cv,cfg)}catch(e){console.warn('Chart err:',e);return null}}

function getF(){var s=D.summary;if(state.app!=='all')s=s.filter(function(r){return r.customer_app_name===state.app});if(state.country!=='all')s=s.filter(function(r){return r.country_list===state.country});if(state.campType!=='all')s=s.filter(function(r){return r.campaign_type===state.campType});return s}
function getR(){var r=D.regions;if(state.app!=='all')r=r.filter(function(x){return x.customer_app_name===state.app});if(state.country!=='all')r=r.filter(function(x){return x.country_list===state.country});if(state.campType!=='all')r=r.filter(function(x){return x.campaign_type===state.campType});return r}

// ── Shareable Link: use Apps Script URL params ──
var deployUrl=''; // populated from server
function saveStateToHash(){} // no-op, state is in URL params when sharing
function loadStateFromUrl(cb){
  // Use google.script.url to read URL parameters
  try{
    google.script.url.getLocation(function(loc){
      var p=loc.parameter||{};
      if(p.app)state.app=p.app;
      if(p.country)state.country=p.country;
      if(p.campType)state.campType=p.campType;
      if(p.tab)state.tab=p.tab;
      // Date range from URL
      if(p.datePreset){currentDateConfig={preset:p.datePreset}}
      else if(p.dateStart&&p.dateEnd){currentDateConfig={startDate:p.dateStart,endDate:p.dateEnd}}
      window._urlParams=p;
      if(cb)cb();
    });
  }catch(e){if(cb)cb()}
}
function applyUrlParamsToDOM(){
  var p=window._urlParams;if(!p)return;
  // Text inputs
  var map={'search':'camp-search','campid':'campid-search','cid':'cid-search','dnuOp':'dnu-op','dnuVal':'dnu-val','cpiOp':'cpi-op','cpiVal':'cpi-val'};
  for(var k in map){if(p[k]){var el=document.getElementById(map[k]);if(el)el.value=p[k]}}
  // Multi-select filters: uncheck all first, then check only the shared ones
  var msMap={'reg':'reg','fmt':'fmt','camp':'camp','cstate':'cstate','campstate':'campstate'};
  for(var msKey in msMap){
    if(p[msKey]){
      var vals=p[msKey].split(',');
      var container=document.getElementById('ms-'+msKey);
      if(!container)continue;
      var cbs=container.querySelectorAll('input[type="checkbox"]');
      cbs.forEach(function(cb){cb.checked=vals.indexOf(cb.value)>=0});
      var btn=container.querySelector('.ms-btn');
      if(btn){
        var checked=container.querySelectorAll('input:checked').length;
        var total=cbs.length;
        btn.textContent=btn.textContent.replace(/\(.*\)/,'('+checked+'/'+total+')');
      }
    }
  }
  window._urlParams=null;
  applyFilters();
}
function copyShareLink(){
  function buildParams(url){
    var p=[];
    if(state.app!=='all')p.push('app='+encodeURIComponent(state.app));
    if(state.country!=='all')p.push('country='+encodeURIComponent(state.country));
    if(state.campType!=='all')p.push('campType='+encodeURIComponent(state.campType));
    if(state.tab!=='overview')p.push('tab='+encodeURIComponent(state.tab));
    // Date range
    if(currentDateConfig){
      if(currentDateConfig.preset)p.push('datePreset='+currentDateConfig.preset);
      if(currentDateConfig.startDate)p.push('dateStart='+currentDateConfig.startDate);
      if(currentDateConfig.endDate)p.push('dateEnd='+currentDateConfig.endDate);
    }
    // Text inputs
    var fields={'camp-search':'search','campid-search':'campid','cid-search':'cid','dnu-op':'dnuOp','dnu-val':'dnuVal','cpi-op':'cpiOp','cpi-val':'cpiVal'};
    for(var id in fields){var el=document.getElementById(id);if(el&&el.value.trim())p.push(fields[id]+'='+encodeURIComponent(el.value.trim()))}
    // Multi-select filters
    var multiSelects={'reg':'reg','fmt':'fmt','camp':'camp','cstate':'cstate','campstate':'campstate'};
    for(var msId in multiSelects){var vals=getSelectedValues(msId);if(vals)p.push(multiSelects[msId]+'='+encodeURIComponent(vals.join(',')))}
    return url+(p.length>0?(url.indexOf('?')>=0?'&':'?')+p.join('&'):'');
  }
  if(deployUrl){
    var u=buildParams(deployUrl);
    if(navigator.clipboard){navigator.clipboard.writeText(u).then(function(){showToast('Link copied!')}).catch(function(){prompt('Copy this link:',u)})}
    else{prompt('Copy this link:',u)}
  }else{
    google.script.run.withSuccessHandler(function(url){
      deployUrl=url;var u=buildParams(url);
      if(navigator.clipboard){navigator.clipboard.writeText(u).then(function(){showToast('Link copied!')}).catch(function(){prompt('Copy this link:',u)})}
      else{prompt('Copy this link:',u)}
    }).getDeployUrl();
  }
}
function showToast(msg){var d=document.createElement('div');d.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 20px;border-radius:8px;font-size:13px;z-index:9999;animation:fadeout 2s forwards';d.textContent=msg;document.body.appendChild(d);setTimeout(function(){d.remove()},2500)}

function init(){
  loadStateFromUrl(function(){
    document.getElementById('subtitle').textContent='Period: '+D.date_range+' \u00b7 '+D.total_creatives+' creatives \u00b7 '+D.total_matched+' daily records \u00b7 Auto-updated from Looker API';
    var bar=document.getElementById('app-bar');
    var apps=[{id:'all',label:'All Apps'}],seen={};
    D.summary.forEach(function(r){var n=r.customer_app_name||r.app_id||'Unknown';if(!seen[n]){seen[n]=1;apps.push({id:n,label:n})}});
    apps.forEach(function(a){var b=document.createElement('button');b.className='tab'+(a.id===state.app?' on':'');b.textContent=a.label;b.onclick=function(){state.app=a.id;state.country='all';state.campType='all';state.selRegion=null;bar.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});b.classList.add('on');renderCountryBar();renderCampTypeBar();dc();renderAll()};bar.appendChild(b)});
    renderCountryBar();
    renderCampTypeBar();
    // Set date button state
    document.querySelectorAll('#date-bar .tab').forEach(function(b){b.classList.remove('on')});
    if(!currentDateConfig){document.getElementById('dt-30d').classList.add('on')}
    else if(currentDateConfig.preset==='all'){document.getElementById('dt-all').classList.add('on')}
    else if(currentDateConfig.preset){var b=document.getElementById('dt-'+currentDateConfig.preset);if(b)b.classList.add('on')}
    else if(currentDateConfig.startDate){
      document.getElementById('dt-custom').classList.add('on');

function sortCreatives(arr){
  if(tblSortCol===null)return arr;
  var fields=['status','customer_app_name','region','cid','ad','creative_state','total_gr','total_dnu','total_spend','overall_cpi','cpi_kpi','poor_kpi','status','ltall','roi2','days_active'];
  var f=fields[tblSortCol]||'total_gr';
  var sorted=arr.slice().sort(function(a,b){
    var av=a[f],bv=b[f];
    if(av==null)av=tblSortAsc?Infinity:-Infinity;
    if(bv==null)bv=tblSortAsc?Infinity:-Infinity;
    if(typeof av==='string')return tblSortAsc?av.localeCompare(bv):bv.localeCompare(av);
    return tblSortAsc?av-bv:bv-av;
  });
  return sorted;
}

function buildMultiSelect(id,label,options,onChange){
  var html='<div class="ms-wrap" id="ms-'+id+'"><button class="ms-btn" onclick="msToggle(\''+id+'\')">'+label+' (All)</button><div class="ms-drop" id="msd-'+id+'">';
  html+='<div class="ms-acts"><button onclick="msAll(\''+id+'\',true)">Select All</button><button onclick="msAll(\''+id+'\',false)">Clear All</button></div>';
  options.forEach(function(o){
    var esc=String(o).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    var short=String(o).length>45?String(o).substring(0,42)+'...':String(o);
    html+='<label title="'+esc+'"><input type="checkbox" checked value="'+esc+'" onchange="msChange(\''+id+'\')">'+short+'</label>';
  });

window.msToggle=function(id){

window.msChange=function(id){
  var d=document.getElementById('msd-'+id);if(!d)return;
  var cbs=d.querySelectorAll('input[type=checkbox]');

};

    var show=true;
    if(regV&&regV.indexOf(rg)===-1)show=false;
    if(fmtV&&fmtV.indexOf(fm)===-1)show=false;
    if(campV&&campV.indexOf(cp)===-1)show=false;
    if(stateV&&cs&&stateV.indexOf(cs)===-1)show=false;
    var rcampstate=r.getAttribute('data-campstate')||'';
    if(campStateV&&rcampstate&&campStateV.indexOf(rcampstate)===-1)show=false;
    if(searchQ&&cp&&cp.toLowerCase().indexOf(searchQ)===-1)show=false;
    if(campIdQ&&rcampid.indexOf(campIdQ)===-1)show=false;

      next=next.nextElementSibling;
    }

  });

};

window.togRD=function(tr){

  tr.parentNode.insertBefore(newRow,tr.nextSibling);
  store[key]=safeChart(document.getElementById('cv_'+chartId),{type:'bar',data:{labels:series.dates,datasets:[
    {label:'Spend',data:series.spend,backgroundColor:'rgba(91,76,212,.35)',borderRadius:2,yAxisID:'y',order:3,datalabels:{display:true,anchor:'end',align:'top',font:{size:8,weight:500},color:'#5a5a72',formatter:function(v){return'$'+v}}},
    {label:'CPI',data:series.cpi,type:'line',borderColor:'#d63031',backgroundColor:'transparent',pointRadius:3,pointBackgroundColor:'#d63031',borderWidth:2,yAxisID:'y1',order:2,datalabels:{display:true,anchor:'end',align:'top',font:{size:8},color:'#d63031',formatter:function(v){return'$'+v.toFixed(1)}}},
    {label:'KPI',data:series.dates.map(function(){return kv}),type:'line',borderColor:'#0ea55a',backgroundColor:'transparent',borderDash:[6,3],pointRadius:0,borderWidth:2,yAxisID:'y1',order:1,datalabels:{display:false}},
    {label:'Poor KPI',data:series.dates.map(function(){return pv}),type:'line',borderColor:'#d63031',backgroundColor:'transparent',borderDash:[4,4],pointRadius:0,borderWidth:1.5,yAxisID:'y1',order:0,datalabels:{display:false}}
  ]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{color:'#5a5a72',font:{size:10}}}},scales:{x:{ticks:{color:'#8e8ea0',font:{size:9},maxRotation:45},grid:{display:false}},y:{position:'left',title:{display:true,text:'Spend ($)',color:'#8e8ea0',font:{size:10}},ticks:{color:'#8e8ea0',callback:function(v){return'$'+v}},grid:{color:'rgba(0,0,0,.06)'}},y1:{position:'right',title:{display:true,text:'CPI ($)',color:'#d63031',font:{size:10}},ticks:{color:'#d63031'},grid:{display:false}}}}});

      html+='<tr data-s data-campgroup="'+toggleId+'" data-region="'+c.region+'" data-fmt="'+(c.fmt||'Unknown')+'" data-camp="'+c.camp.replace(/"/g,'&quot;')+'" data-cstate="'+(c.creative_state||'')+'" data-campid="'+(c.campaign_id||'')+'" data-cidnum="'+(c.cid||c.creative_id||'')+'" data-dnu="'+(c.total_dnu||0)+'" data-cpi="'+(c.overall_cpi||0)+'" data-campstate="'+(c.campaign_state||'')+'" data-key="'+c.app_id+'|'+c.region+'|'+c.camp+'|'+c.ad+'" data-cid="'+(c.creative_id||c.cid||'')+'" data-extid="'+(c.external_id||'')+'" data-fmt-raw="'+(c.fmt||'')+'" onclick="togTbl(this)" style="'+(isPaused?'display:none':'')+'">'+ 
      '<td>'+statusTag(c.status,c.overall_cpi,c.cpi_kpi)+'</td>'+
      '<td style="font-size:11px">'+(c.customer_app_name||c.app_id)+'</td><td><span class="reg">'+c.region+'</span></td>'+
      '<td>'+cidLink(c.cid,c.creative_id)+'</td>'+
      '<td style="font-size:10px;max-width:320px;word-break:break-all;line-height:1.3" title="'+c.ad.replace(/"/g,'&quot;')+'">'+c.ad+'</td>'+
      '<td style="font-size:10px;color:'+stColor+';font-weight:600">'+(c.creative_state||'\u2014')+'</td>'+
      '<td>'+fmt(c.total_gr)+'</td><td>'+N(c.total_dnu)+'</td>'+
      '<td>'+fmt(c.total_spend)+'</td>'+
      '<td style="color:'+sc+';font-weight:600">$'+(c.overall_cpi||0).toFixed(2)+'</td>'+
      '<td style="color:var(--t3)">$'+(c.cpi_kpi||0).toFixed(2)+'</td>'+
      '<td style="color:var(--t3)">$'+(c.poor_kpi||0).toFixed(2)+'</td>'+
      '<td>'+plainStatus(c.status)+'</td>'+
      '<td>'+ltallCell(c.ltall,c.ltall_kpi)+'</td>'+
      '<td>'+roi2Cell(c.roi2,c.roi2_kpi)+'</td>'+
      '<td>'+c.days_active+'</td></tr>';
    });});
  });
  return html;
}

/* Table row click → chart */
window.togTbl=function(tr){
  if(event&&event.target.tagName==='A')return; // don't trigger on link clicks
  var key=tr.getAttribute('data-key');if(!key)return;
  var isOpen=tr.classList.contains('sel');
  tr.classList.toggle('sel');
  var chartId='tch_'+key.replace(/[^a-zA-Z0-9]/g,'_');
  if(!isOpen){
    insertChartRow(tr,key,chartId,'tblCharts');
  } else {
    if(tblCharts[key]){tblCharts[key].destroy();delete tblCharts[key]}
    var cr=document.getElementById(chartId);if(cr)cr.remove();
  }
};

// ── Format Audit Tab ──
window.renderFormatAudit=function(el){
  var audit=D.format_audit||[];
  if(!audit.length||audit.error){
    el.innerHTML='<div class="insight">No format audit data available. The Looker format query may not have returned results.</div>';
    return;
  }
  
  var MAJOR=['VAST Portrait Phone','HTML Portrait Phone Interstitial','Native Static','VAST Landscape Phone','Banner Phone','VX Only Interstitial','HTML Landscape Phone Interstitial','MREC Static'];
  var shortName={'VAST Portrait Phone':'VAST Port','HTML Portrait Phone Interstitial':'HTML Port','Native Static':'Native','VAST Landscape Phone':'VAST Land','Banner Phone':'Banner','VX Only Interstitial':'VX Only','HTML Landscape Phone Interstitial':'HTML Land','MREC Static':'MREC'};
  
  // Build filter options from full audit data
  var appSet={},countrySet={};
  audit.forEach(function(a){if(a.app_name)appSet[a.app_name]=1;if(a.country_list)countrySet[a.country_list]=1});
  var appList=Object.keys(appSet).sort();
  var countryList=Object.keys(countrySet).sort();
  
  // Apply filters
  var filtered=audit.slice();
  if(state.app!=='all')filtered=filtered.filter(function(a){return a.app_name===state.app});
  if(state.country!=='all')filtered=filtered.filter(function(a){return a.country_list===state.country});
  var appV=(document.getElementById('fa-app')||{}).value||'';
  var countryV=(document.getElementById('fa-country')||{}).value||'';
  if(appV)filtered=filtered.filter(function(a){return a.app_name===appV});
  if(countryV)filtered=filtered.filter(function(a){return a.country_list===countryV});
  
  var html='<div class="insight"><b>Creative Format Audit:</b> '+filtered.length+' of '+audit.length+' campaigns. Red \u2717 = missing format.</div>';
  // Filter controls
  html+='<div style="display:flex;gap:8px;margin:8px 0;align-items:center;flex-wrap:wrap">';
  html+='<span style="font-size:11px;color:var(--t3);font-weight:600">FILTER:</span>';
  html+='<select id="fa-app" onchange="renderFormatAudit(document.getElementById(\'content\'))" style="padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:11px;font-family:inherit"><option value="">All Apps</option>';
  appList.forEach(function(a){html+='<option value="'+a.replace(/"/g,'&quot;')+'"'+(appV===a?' selected':'')+'>'+a+'</option>'});
  html+='</select>';
  html+='<select id="fa-country" onchange="renderFormatAudit(document.getElementById(\'content\'))" style="padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:11px;font-family:inherit"><option value="">All Countries</option>';
  countryList.forEach(function(c){html+='<option value="'+c.replace(/"/g,'&quot;')+'"'+(countryV===c?' selected':'')+'>'+c+'</option>'});
  html+='</select>';
  html+='<button onclick="downloadFormatAuditCSV()" style="padding:4px 10px;border:1px solid var(--accent);border-radius:6px;cursor:pointer;font-family:inherit;font-size:11px;background:var(--accent);color:#fff;margin-left:auto">\u2913 Download CSV</button>';
  html+='</div>';
  
  html+='<div class="scroll"><table><tr><th>Campaign</th><th>App</th><th>Country</th>';
  MAJOR.forEach(function(f){html+='<th style="font-size:10px;writing-mode:vertical-lr;text-align:center;padding:4px 2px;min-width:32px">'+(shortName[f]||f)+'</th>'});
  html+='<th>Missing</th></tr>';
  
  filtered.forEach(function(a){
    html+='<tr><td style="font-size:11px;max-width:300px;word-break:break-all">'+campCell(a.campaign_name,a.campaign_id)+'</td>';
    html+='<td style="font-size:11px">'+a.app_name+'</td>';
    html+='<td style="font-size:11px">'+a.country_list+'</td>';
    MAJOR.forEach(function(f){
      var has=a.present.indexOf(f)>=0;
      var cnt=a.present_counts[f]||0;
      html+='<td style="text-align:center;font-size:11px;background:'+(has?'rgba(39,174,96,.08)':'rgba(231,76,60,.08)')+'"><span style="color:'+(has?'var(--ok)':'var(--danger)')+';font-weight:600">'+(has?cnt:'\u2717')+'</span></td>';
    });
    html+='<td style="font-size:11px;color:var(--danger);font-weight:600">'+a.missing_count+'/'+MAJOR.length+'</td></tr>';
  });
  html+='</table></div>';
  el.innerHTML=html;
};

window.downloadFormatAuditCSV=function(){
  var audit=D.format_audit||[];
  if(!audit.length)return;
  var MAJOR=['VAST Portrait Phone','HTML Portrait Phone Interstitial','Native Static','VAST Landscape Phone','Banner Phone','VX Only Interstitial','HTML Landscape Phone Interstitial','MREC Static'];
  // Apply same filters
  var filtered=audit.slice();
  if(state.app!=='all')filtered=filtered.filter(function(a){return a.app_name===state.app});
  if(state.country!=='all')filtered=filtered.filter(function(a){return a.country_list===state.country});
  var appV=(document.getElementById('fa-app')||{}).value||'';
  var countryV=(document.getElementById('fa-country')||{}).value||'';
  if(appV)filtered=filtered.filter(function(a){return a.app_name===appV});
  if(countryV)filtered=filtered.filter(function(a){return a.country_list===countryV});
  // Build CSV
  var header=['Campaign Name','Campaign ID','App','Country'].concat(MAJOR).concat(['Missing Count','Missing Formats']);
  var csv=[header.map(function(h){return'"'+h+'"'}).join(',')];
  filtered.forEach(function(a){
    var row=['"'+(a.campaign_name||'').replace(/"/g,'""')+'"',a.campaign_id||'','"'+(a.app_name||'')+'"','"'+(a.country_list||'')+'"'];
    MAJOR.forEach(function(f){row.push(a.present.indexOf(f)>=0?(a.present_counts[f]||0):0)});
    row.push(a.missing_count);
    row.push('"'+(a.missing.join(', '))+'"');
    csv.push(row.join(','));
  });
  var blob=new Blob(['\uFEFF'+csv.join('\n')],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);var link=document.createElement('a');link.href=url;link.download='format_audit_'+new Date().toISOString().substring(0,10)+'.csv';document.body.appendChild(link);link.click();document.body.removeChild(link);
};

// Get missing formats for a campaign (for campaign header badges)
function getMissingFormats(campName){
  if(!D.format_audit||!D.format_audit.length)return[];
  var a=D.format_audit.find(function(x){return x.campaign_name===campName});
  return a?a.missing:[];
}

window.dlCSV=function(){
  var s=getF();
  var mode=state.tab;
  if(mode==='good')s=s.filter(function(r){return r.status==='GOOD'});
  else if(mode==='watch')s=s.filter(function(r){return r.status==='WATCH'});
  else if(mode==='poor')s=s.filter(function(r){return r.status==='POOR'});
  else if(mode==='nodnu')s=s.filter(function(r){return r.status==='NO_DNU'});
  var sq=(document.getElementById('camp-search')||{}).value||'';sq=sq.trim().toLowerCase();
  var cq=(document.getElementById('cid-search')||{}).value||'';cq=cq.trim();
  var cpq=(document.getElementById('campid-search')||{}).value||'';cpq=cpq.trim();
  if(sq)s=s.filter(function(r){return r.camp.toLowerCase().indexOf(sq)>=0});
  if(cq)s=s.filter(function(r){return String(r.cid||r.creative_id||'').indexOf(cq)>=0});
  if(cpq)s=s.filter(function(r){return String(r.campaign_id||'').indexOf(cpq)>=0});
  var regV=getSelectedValues('reg');if(regV)s=s.filter(function(r){return regV.indexOf(r.region)>=0});
  var fmtV=getSelectedValues('fmt');if(fmtV)s=s.filter(function(r){return fmtV.indexOf(r.fmt||'Unknown')>=0});
  var header=['Status','App','Campaign Type','Region','Creative ID','Ad Name','Format','Creative State','Campaign Status','Campaign','Campaign ID','Revenue','DNU','Spend','CPI','KPI','Poor KPI','vs KPI','LTall','ROI2','Days'];
  var csv=[header.map(function(h){return'"'+h+'"'}).join(',')];
  s.forEach(function(c){
    var vsKpi=c.status==='GOOD'?'PASS':(c.status==='WATCH'||c.status==='POOR')?'FAIL':'N/A';
    csv.push(['"'+c.status+'"','"'+(c.customer_app_name||c.app_id||'')+'"','"'+(c.campaign_type||'ua').toUpperCase()+'"','"'+c.region+'"','"'+(c.cid||c.creative_id||'')+'"','"'+(c.ad||'').replace(/"/g,'""')+'"','"'+(c.fmt||'')+'"','"'+(c.creative_state||'')+'"','"'+(c.campaign_state||'')+'"','"'+(c.camp||'').replace(/"/g,'""')+'"',c.campaign_id||'',c.total_gr||0,c.total_dnu||0,c.total_spend||0,c.overall_cpi||0,c.cpi_kpi||0,c.poor_kpi||0,'"'+vsKpi+'"',c.ltall!==null?c.ltall:'',c.roi2!==null?c.roi2:'',c.days_active||0].join(','));
  });
  var blob=new Blob(['\uFEFF'+csv.join('\n')],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='creative_cpi_'+new Date().toISOString().substring(0,10)+'.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);
}
